# Builds tandem.cpp (patched llama.cpp) llama-server for Windows with CUDA.
# Trigger manually from the Actions tab: Run workflow.
name: Build llama-server (Windows CUDA)

on:
  workflow_dispatch:

jobs:
  build-windows-cuda:
    runs-on: windows-latest
    timeout-minutes: 240
    steps:
      # Global git config must be set BEFORE checkout so files are checked out
      # with LF endings (git apply of tandem.patch inside build.sh needs LF).
      - name: Force LF line endings
        shell: bash
        run: |
          git config --global core.autocrlf false
          git config --global core.eol lf

      - uses: actions/checkout@v4

      # CUDA has a hard MSVC version gate (crt/host_config.h): CUDA 13.1 only
      # supports VS 2019..2022, VS 2026 needs CUDA 13.4+. Prefer VS 2022 when
      # present, otherwise use the newest VS with a matching CUDA release.
      - name: Select Visual Studio
        id: vs
        shell: pwsh
        run: |
          $vswhere = "${env:ProgramFiles(x86)}\Microsoft Visual Studio\Installer\vswhere.exe"
          $vs2022 = & $vswhere -version "[17.0,18.0)" -latest -property installationPath
          if ($vs2022) {
            Write-Host "Selected VS 2022: $vs2022"
            "vsroot=$vs2022" >> $env:GITHUB_OUTPUT
            "cuda_version=13.1.0" >> $env:GITHUB_OUTPUT
          } else {
            $latest = & $vswhere -latest -property installationPath
            Write-Host "Selected newest VS (2026?): $latest"
            "vsroot=$latest" >> $env:GITHUB_OUTPUT
            "cuda_version=13.4.0" >> $env:GITHUB_OUTPUT
          }

      - name: Install CUDA ${{ steps.vs.outputs.cuda_version }}
        uses: Jimver/cuda-toolkit@master
        with:
          cuda: ${{ steps.vs.outputs.cuda_version }}
          method: 'network'

      - name: Build llama-server
        shell: pwsh
        run: |
          # VS generator can't find the CUDA toolset (CUDA is installed after VS),
          # so use Ninja with a VS dev shell environment (cl.exe + INCLUDE/LIB on PATH).
          $vsRoot = "${{ steps.vs.outputs.vsroot }}"
          & "$vsRoot\Common7\Tools\Launch-VsDevShell.ps1" -Arch amd64 -HostArch amd64
          Write-Host "cl: $((Get-Command cl -ErrorAction SilentlyContinue).Source)"
          Write-Host "nvcc: $((Get-Command nvcc -ErrorAction SilentlyContinue).Source)"
          Write-Host "ninja: $((Get-Command ninja -ErrorAction SilentlyContinue).Source)"
          $env:CMAKE_GENERATOR = "Ninja"
          bash build.sh tandem -DCMAKE_CUDA_ARCHITECTURES=120

      # Print the tandem/MTP related flags so the run log shows what this build supports.
      - name: Verify tandem flags
        shell: bash
        run: ./tandem/build/bin/llama-server.exe --help 2>&1 | grep -iE -- "moe-cache-mib|cpu-moe|cmoe|draft-mtp|spec-type" || true

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: llama-server-windows-cuda
          path: |
            tandem/build/bin/llama-server.exe
            tandem/build/bin/*.dll
          retention-days: 7
          if-no-files-found: error
